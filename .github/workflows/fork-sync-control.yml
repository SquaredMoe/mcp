name: Fork Sync Dashboard & Auto-Enroll

on:
  schedule:
    - cron: "13 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-sync-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    name: Check forks, enroll future forks, publish dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Discover forks and refresh status
        env:
          FORK_OWNER: SquaredMoe
          GITHUB_TOKEN: ${{ github.token }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: python3 scripts/fork_sync_control.py

      - name: Commit dashboard report if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fork-sync-dashboard.md
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "docs: refresh fork sync dashboard [skip ci]"
            git push
          fi
